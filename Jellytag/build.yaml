---
# Plugin metadata, single source for meta.json and the manifest entry (`just package`).
# The version is not here: it comes from the release tag.
name: "JellyTag"
guid: "bac81a9b-ef92-4c18-a96a-7c34e4695836"
targetAbi: "12.0.0.0"
framework: "net10.0"
owner: "Atilili"
category: "General"
overview: "Overlays quality badges (resolution, HDR, codec, audio, language) on media posters and thumbnails"
# Folded (>): lines are joined, so the catalog shows real paragraphs.
description: >
  JellyTag automatically overlays quality badges on your media posters and
  thumbnails: resolution, HDR and Dolby Vision, video codec, audio, language
  flags and VOST indicator. Badges are rendered server-side and visible on all
  Jellyfin clients.


  Per-panel configuration, SVG and text badge styles, custom badge upload, live
  preview and library filtering.
artifacts:
  - "Jellyfin.Plugin.JellyTag.dll"
changelog: |
  - Seven more audio badges: FLAC, DTS-HD HRA, DTS, Dolby Digital, Dolby Digital
    Plus, AAC and Opus. Tick them in the Audio panel to show them.
  - New "Audio badge source" setting: read the audio badges from the default
    track or from the best of all tracks.
  - Badges on item detail pages of the web client (movies, series, seasons and
    episodes), with an on/off switch and a size setting.
  - New plugin identity (GUID): this build is installed from its own plugin
    repository and no longer updates from the original catalog. Uninstall the
    original JellyTag before installing it.
